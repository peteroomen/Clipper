<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Clipper — Anthropic API key</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1b1e24;
        color: #e7e9ee;
        padding: 24px;
      }
      h1 { font-size: 16px; margin: 0 0 6px; }
      p { margin: 0 0 16px; color: #9aa1ad; font-size: 12.5px; }
      label { display: block; font-size: 12px; color: #9aa1ad; margin-bottom: 6px; }
      input {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #333944; background: #12151a; color: #e7e9ee;
        font: 13px/1.4 ui-monospace, monospace; outline: none;
      }
      input:focus { border-color: #6b8afd; }
      .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
      button {
        padding: 9px 16px; border-radius: 8px; border: 1px solid #333944;
        background: #262b34; color: #e7e9ee; font-size: 13px; cursor: pointer;
      }
      button.primary { background: #4666e6; border-color: #4666e6; color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      .note { margin-top: 14px; font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>Enter your Anthropic API key</h1>
    <p>Clipper's tone assistant calls the Anthropic API directly from this app. Your key is stored locally in this app's data folder (plain text) and is never sent anywhere except Anthropic.</p>
    <label for="key">ANTHROPIC_API_KEY</label>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
    <div class="row">
      <button id="skip">Skip for now</button>
      <button id="save" class="primary" disabled>Save &amp; continue</button>
    </div>
    <div class="note">You can also relaunch with <code>MOCK=1</code> for a keyless demo.</div>

    <script>
      const input = document.getElementById('key');
      const save = document.getElementById('save');
      const skip = document.getElementById('skip');
      input.addEventListener('input', () => {
        save.disabled = input.value.trim().length === 0;
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !save.disabled) submit(input.value);
      });
      function submit(v) {
        save.disabled = true;
        window.clipperKeyPrompt.submit(v);
      }
      save.addEventListener('click', () => submit(input.value));
      skip.addEventListener('click', () => window.clipperKeyPrompt.submit(''));
      input.focus();
    </script>
  </body>
</html>
